# 简单鹤 · 拼音反查词典
schema:
  schema_id: jdhe_pinyin
  name: JDhe 拼音反查
  version: "9.3"
  author:
    - 简单
  language: zh

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - reverse_lookup_filter@jdhe_rev
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  max_code_length: 24

translator:
  dictionary: jdhe
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false

jdhe_rev:
  dictionary: jdhe
  overwrite_comment: true
  comment_format:
    - 'xform/^.*?\[([^]]+)\]([a-z]+).*$/[$1·$2]/'
    - 'xform/^[a-z]+$//'
